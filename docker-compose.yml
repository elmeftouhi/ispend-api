version: '3.8'
services:
  app:
    build: .
    image: 'expense-api-v1:latest'
    expose:
      - '8081:8080'
    depends_on:
      - db
    restart: on-failure
  db:
    image: 'postgres:15-alpine'
    environment:
      POSTGRES_DB: expense_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - 'db-data:/var/lib/postgresql/data'
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} || exit 1'
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db-data:
    name: expense_api_v1_db_data
